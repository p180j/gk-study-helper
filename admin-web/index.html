<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公考学习助手 · 运营管理控台</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">GK</span><div><strong>公考学习助手</strong><small>运营管理控台</small></div></div>
    <nav id="navigation" aria-label="主导航"></nav>
    <div class="sidebar-foot"><span class="live-dot"></span><span>真实数据环境</span></div>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div><div id="breadcrumb" class="breadcrumb">工作台</div><h1 id="pageTitle">运营工作台</h1><p id="pageDescription">掌握内容供给、学习闭环和系统健康状态</p></div>
      <div class="top-actions"><span id="status" class="status">就绪</span><button id="contextButton" class="user-chip">用户 <b id="currentUser">1</b> · 连接设置</button></div>
    </header>
    <section id="content" class="content" aria-live="polite"></section>
  </main>
  <dialog id="detailDialog" class="drawer"><button class="dialog-close" aria-label="关闭">×</button><div id="detailContent"></div></dialog>
  <dialog id="formDialog" class="modal"><button class="dialog-close" aria-label="关闭">×</button><div id="formContent"></div></dialog>
  <script src="./api.js"></script>
  <script src="./display.js"></script>
  <script src="./app.js"></script>
</body>
</html>
