<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公考学习助手 · 管理控台</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside>
    <div class="brand"><span>GK</span><div>公考学习助手<small>内容管理控台</small></div></div>
    <nav>
      <button data-view="questions" class="active">题库</button>
      <button data-view="import">题目导入</button>
      <button data-view="knowledge">知识点</button>
      <button data-view="answers">答题记录</button>
      <button data-view="essays">申论题库</button>
      <button data-view="essay-answers">申论作答</button>
      <button data-view="readings">政治阅读</button>
      <button data-view="content">内容管理</button>
      <button data-view="ai">AI 设置</button>
    </nav>
    <div class="connection">
      <label>API 地址</label>
      <input id="baseUrl" value="http://127.0.0.1:8080">
      <label>当前用户</label>
      <input id="userId" type="number" value="1" min="1">
      <button id="saveContext">保存连接</button>
    </div>
  </aside>
  <main>
    <header><div><h1 id="pageTitle">题库</h1><p>真实后端数据，不使用前端假数据</p></div><span id="status" class="status">就绪</span></header>
    <section id="content" aria-live="polite"></section>
  </main>
  <dialog id="detailDialog"><button class="close" aria-label="关闭">×</button><div id="detailContent"></div></dialog>
  <dialog id="formDialog"><button class="close" aria-label="关闭">×</button><div id="formContent"></div></dialog>
  <script src="./api.js"></script>
  <script src="./app.js"></script>
</body>
</html>
