server:
  port: ${SERVER_PORT:8089}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gk_study_helper?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  configuration:
    map-underscore-to-camel-case: true
ai:
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
  retry-count: ${AI_RETRY_COUNT:1}
